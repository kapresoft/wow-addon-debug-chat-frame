package-as: DebugChatFrame
# --------------------------
license-output: LICENSE.txt
enable-nolib-creation: no

manual-changelog:
  filename: CHANGELOG.txt
  markup-type: markdown

embedded-libraries:
  - LibStub
  - LibPrettyPrint
  - Ace3

tools-used:
  - DevSuite
  - Bugsack
  - Bug-Grabber

externals:
  ThirdParty/Libs/LibPrettyPrint: https://github.com/kapresoft/wow-addon-LibPrettyPrint
  ThirdParty/Libs/Ace3: https://repos.wowace.com/wow/ace3/trunk
  ThirdParty/Libs/Kapresoft-LibUtil: https://github.com/kapresoft/wow-lib-util

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.yml"
  - "*.txt"
  - dev
  - doc
  - scripts
  - Libs/Developer
  - ThirdParty/Libs/LibPrettyPrint/dev
